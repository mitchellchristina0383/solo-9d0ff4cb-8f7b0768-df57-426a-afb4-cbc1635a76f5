services:
  oci-troubleshoot:
    build: .
    image: oci-troubleshoot:latest
    container_name: oci-troubleshoot
    ports:
      - "8000:8000"
    restart: unless-stopped
    read_only: true
    environment:
      # 持久卷根目录：初始化好的命名卷落盘在这里
      VOLUME_ROOT: /srv/data/volumes
    volumes:
      # 命名卷持久化：容器重建后已初始化的卷仍在
      - volume-data:/srv/data
    tmpfs:
      - /tmp:size=64m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  volume-data:
